<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>My Anime Tracker</h1>

  <form id="anime-form">
    <label for="anime-title">Anime title</label>
    <input type="text" id="anime-title" placeholder="Enter Anime Name" required>

    <label for="anime-status">Status</label>
    <select id="anime-status">
      <option value="Watching">Watching</option>
      <option value="Completed">Completed</option>
      <option value="Plan to Watch">Plan to Watch</option>
    </select>

    <label for="anime-rating">Rating </label>
    <input type="number" id="anime-rating" placeholder="1-10" min="1" max="10" step="1">

    <button type="submit" id="submit-button">Add Anime</button>
  </form>

  <h2>My List</h2>

  <div id="anime-list"></div>

  <!-- Edit popup -->
  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <h2 id="edit-heading">Edit Anime</h2>

    <form id="edit-form">
      <label for="edit-title">Anime title</label>
      <input id="edit-title" type="text" required>

      <label for="edit-status">Status</label>
      <select id="edit-status">
        <option value="Watching">Watching</option>
        <option value="Completed">Completed</option>
        <option value="Plan to Watch">Plan to Watch</option>
      </select>

      <label for="edit-rating">Rating (1–10, optional)</label>
      <input id="edit-rating" type="number" min="1" max="10" step="1">

      <button type="submit">Save Changes</button>
      <button type="button" id="cancel-edit">Cancel</button>
    </form>
  </dialog>

  <!-- Delete popup -->
  <dialog id="delete-dialog" aria-labelledby="delete-heading">
    <h2 id="delete-heading">Delete Anime</h2>

    <p id="delete-message"></p>

    <button type="button" id="cancel-delete" autofocus>Cancel</button>
    <button type="button" id="confirm-delete">Delete</button>
  </dialog>

  <script src="./node_modules/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
